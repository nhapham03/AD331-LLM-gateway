[project]
name = "multi-provider-llm-gateway"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "nhapham03", email = "phamminhnha2003@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "fastapi>=0.162.0",
    "openai>=3.37.0",
    "pydantic>=2.14.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.1",
    "tiktoken>=0.14.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
multi-provider-llm-gateway = "multi_provider_llm_gateway:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"